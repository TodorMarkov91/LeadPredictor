<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a2332;
            color: #e0e6f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1e2a3a;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #2d3f55;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-icon {
            background: #3a5070;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
            color: #e0e6f0;
        }

        .container {
            display: flex;
            flex: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #1e2a3a;
            padding: 24px 20px;
            border-right: 1px solid #2d3f55;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8b9bb4;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .form-group select,
        .form-group input[type="date"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 9px 12px;
            background: #243044;
            border: 1px solid #2d3f55;
            color: #e0e6f0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: #4a90e2;
        }

        .input-prefix {
            display: flex;
            align-items: center;
            background: #243044;
            border: 1px solid #2d3f55;
            border-radius: 6px;
            overflow: hidden;
        }

        .input-prefix span {
            padding: 9px 10px;
            background: #1e2a3a;
            color: #8b9bb4;
            border-right: 1px solid #2d3f55;
            font-size: 14px;
            flex-shrink: 0;
        }

        .input-prefix input {
            border: none !important;
            border-radius: 0 !important;
            flex: 1;
            background: transparent;
        }

        /* Main */
        .main {
            flex: 1;
            padding: 24px;
            display: flex;
            gap: 24px;
            overflow: hidden;
        }

        .chart-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        /* Chart */
        .chart-wrapper {
            background: #1e2a3a;
            border-radius: 10px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chart-inner {
            display: flex;
            flex: 1;
            gap: 8px;
        }

        .y-axis-label {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: #8b9bb4;
            font-size: 11px;
            text-align: center;
            flex-shrink: 0;
        }

        .chart-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chart-rows {
            flex: 1;
        }

        .chart-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
            position: relative;
        }

        .month-label {
            width: 20px;
            text-align: right;
            color: #8b9bb4;
            font-size: 12px;
            flex-shrink: 0;
        }

        .bars-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .bar-wrapper {
            height: 13px;
            background: #2d3f55;
            border-radius: 2px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .bar-prospects { background: #4a6080; }
        .bar-leads     { background: #6a8aaa; }
        .bar-customers { background: #8aaac8; }

        /* X-axis */
        .x-axis {
            display: flex;
            margin-left: 28px;
            margin-top: 6px;
            color: #8b9bb4;
            font-size: 10px;
        }

        .x-axis span {
            flex: 1;
            text-align: center;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: #243044;
            border: 1px solid #4a90e2;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            line-height: 1.6;
            white-space: nowrap;
        }

        .tooltip.visible { display: block; }

        /* Sliders */
        .sliders-section {
            background: #1e2a3a;
            border-radius: 10px;
            padding: 20px;
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-group:last-child {
            margin-bottom: 0;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .slider-label { color: #e0e6f0; font-size: 14px; }
        .slider-value { color: #8b9bb4; font-size: 14px; }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 4px;
            background: #2d3f55;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #e0e6f0;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #4a90e2;
        }

        /* Cards */
        .cards-section {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        .card {
            background: #243044;
            border-radius: 10px;
            padding: 16px 18px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b9bb4;
            font-size: 14px;
        }

        .card-pct { color: #8b9bb4; font-size: 13px; }

        .card-value {
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .card-bar-bg {
            height: 6px;
            background: #1e2a3a;
            border-radius: 3px;
            overflow: hidden;
        }

        .card-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .card-prospects .card-bar-fill { background: #607d9e; }
        .card-leads .card-bar-fill     { background: #4a90e2; }
        .card-customers .card-bar-fill { background: #5aaa7a; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">&#9660;</span>
            <span><strong>Lead</strong>Predictor</span>
        </div>
    </header>

    <div class="container">

        <aside class="sidebar">
            <div class="form-group">
                <label>Language</label>
                <select id="language">
                    <option value="en">&#127482;&#127480; English</option>
                    <option value="bg">&#127463;&#127468; Bulgarian</option>
                    <option value="de">&#127465;&#127466; German</option>
                    <option value="fr">&#127467;&#127479; French</option>
                </select>
            </div>

            <div class="form-group">
                <label>Currency</label>
                <select id="currency">
                    <option value="USD">$ US Dollar</option>
                    <option value="EUR">&#8364; Euro</option>
                    <option value="BGN">&#1083;&#1074; Bulgarian Lev</option>
                    <option value="GBP">&#163; British Pound</option>
                </select>
            </div>

            <div class="form-group">
                <label>Campaign Start</label>
                <input type="date" id="campaignStart" value="2026-05-08">
            </div>

            <div class="form-group">
                <label>Campaign End</label>
                <input type="date" id="campaignEnd" value="2026-11-04">
            </div>

            <div class="form-group">
                <label>Total Revenue</label>
                <div class="input-prefix">
                    <span id="currencySymbol">$</span>
                    <input type="number" id="totalRevenue" value="10000" min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Avg. Order Value</label>
                <div class="input-prefix">
                    <span id="currencySymbol2">$</span>
                    <input type="number" id="avgOrderValue" value="1000" min="1">
                </div>
            </div>
        </aside>

        <main class="main">

            <div class="chart-section">
                <div class="chart-wrapper">
                    <div class="chart-inner">
                        <div class="y-axis-label">Months</div>
                        <div class="chart-body">
                            <div class="chart-rows" id="chartRows"></div>
                            <div class="x-axis" id="xAxis"></div>
                        </div>
                    </div>
                </div>

                <div class="sliders-section">
                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="slider-label">Lead Response Rate</span>
                            <span class="slider-value" id="leadRateVal">40.00%</span>
                        </div>
                        <input type="range" id="leadRate" min="1" max="100" value="40" step="0.1">
                    </div>
                    <div class="slider-group">
                        <div class="slider-header">
                            <span class="slider-label">Prospect Response Rate</span>
                            <span class="slider-value" id="prospectRateVal">20.00%</span>
                        </div>
                        <input type="range" id="prospectRate" min="1" max="100" value="20" step="0.1">
                    </div>
                </div>
            </div>

            <div class="cards-section">
                <div class="card card-prospects">
                    <div class="card-header">
                        <div class="card-title">
                            <span>&#128193;</span><span>Prospects</span>
                        </div>
                        <span class="card-pct">100%</span>
                    </div>
                    <div class="card-value" id="prospectsVal">125</div>
                    <div class="card-bar-bg">
                        <div class="card-bar-fill" id="prospectsBar" style="width:100%"></div>
                    </div>
                </div>

                <div class="card card-leads">
                    <div class="card-header">
                        <div class="card-title">
                            <span>&#128100;</span><span>Leads</span>
                        </div>
                        <span class="card-pct" id="leadsPct">20%</span>
                    </div>
                    <div class="card-value" id="leadsVal">25</div>
                    <div class="card-bar-bg">
                        <div class="card-bar-fill" id="leadsBar" style="width:20%"></div>
                    </div>
                </div>

                <div class="card card-customers">
                    <div class="card-header">
                        <div class="card-title">
                            <span>&#127942;</span><span>Customers</span>
                        </div>
                        <span class="card-pct" id="customersPct">8%</span>
                    </div>
                    <div class="card-value" id="customersVal">10</div>
                    <div class="card-bar-bg">
                        <div class="card-bar-fill" id="customersBar" style="width:8%"></div>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        function getMonths() {
            const start = new Date(document.getElementById('campaignStart').value);
            const end   = new Date(document.getElementById('campaignEnd').value);
            if (isNaN(start) || isNaN(end) || end <= start) return 6;
            const months = Math.round((end - start) / (1000 * 60 * 60 * 24 * 30.44));
            return Math.max(1, Math.min(months, 12));
        }

        function calculate() {
            const revenue  = parseFloat(document.getElementById('totalRevenue').value)  || 0;
            const avgOrder = parseFloat(document.getElementById('avgOrderValue').value) || 1;
            const leadRate     = parseFloat(document.getElementById('leadRate').value)     / 100;
            const prospectRate = parseFloat(document.getElementById('prospectRate').value) / 100;

            const customers = Math.round(revenue / avgOrder);
            const leads     = Math.round(customers / leadRate);
            const prospects = Math.round(leads / prospectRate);
            return { customers, leads, prospects };
        }

        function renderChart(prospects, leads, customers, months) {
            const chartRows = document.getElementById('chartRows');
            const xAxis     = document.getElementById('xAxis');
            const maxVal    = prospects || 1;
            const steps     = 5;

            xAxis.innerHTML = '';
            for (let i = 0; i <= steps; i++) {
                const span = document.createElement('span');
                span.textContent = Math.round(maxVal * i / steps) + ' people';
                xAxis.appendChild(span);
            }

            chartRows.innerHTML = '';
            for (let m = 1; m <= months; m++) {
                const mP = Math.round(prospects * m / months);
                const mL = Math.round(leads     * m / months);
                const mC = Math.round(customers * m / months);

                const row = document.createElement('div');
                row.className = 'chart-row';

                const lbl = document.createElement('div');
                lbl.className = 'month-label';
                lbl.textContent = m;
                row.appendChild(lbl);

                const group = document.createElement('div');
                group.className = 'bars-group';

                [{ val: mP, cls: 'bar-prospects' },
                 { val: mL, cls: 'bar-leads' },
                 { val: mC, cls: 'bar-customers' }].forEach(b => {
                    const wrap = document.createElement('div');
                    wrap.className = 'bar-wrapper';
                    const fill = document.createElement('div');
                    fill.className = 'bar-fill ' + b.cls;
                    fill.style.width = (b.val / maxVal * 100) + '%';
                    wrap.appendChild(fill);
                    group.appendChild(wrap);
                });

                row.appendChild(group);

                row.addEventListener('mouseenter', e => {
                    const tip = document.getElementById('tooltip');
                    tip.innerHTML = `<strong>Month #${m}</strong><br>Prospects: ${mP}<br>Leads: ${mL}<br>Customers: ${mC}`;
                    tip.classList.add('visible');
                });
                row.addEventListener('mousemove', e => {
                    const tip = document.getElementById('tooltip');
                    tip.style.left = (e.clientX + 14) + 'px';
                    tip.style.top  = (e.clientY - 10) + 'px';
                });
                row.addEventListener('mouseleave', () => {
                    document.getElementById('tooltip').classList.remove('visible');
                });

                chartRows.appendChild(row);
            }
        }

        function update() {
            const { customers, leads, prospects } = calculate();
            const months = getMonths();

            document.getElementById('prospectsVal').textContent = prospects;
            document.getElementById('leadsVal').textContent     = leads;
            document.getElementById('customersVal').textContent = customers;

            const leadsPct     = prospects > 0 ? Math.round(leads     / prospects * 100) : 0;
            const customersPct = prospects > 0 ? Math.round(customers / prospects * 100) : 0;

            document.getElementById('leadsPct').textContent     = leadsPct + '%';
            document.getElementById('customersPct').textContent = customersPct + '%';
            document.getElementById('leadsBar').style.width     = leadsPct + '%';
            document.getElementById('customersBar').style.width = Math.min(customersPct, 100) + '%';

            document.getElementById('leadRateVal').textContent =
                parseFloat(document.getElementById('leadRate').value).toFixed(2) + '%';
            document.getElementById('prospectRateVal').textContent =
                parseFloat(document.getElementById('prospectRate').value).toFixed(2) + '%';

            const symbols = { USD: '$', EUR: '€', BGN: 'лв', GBP: '£' };
            const sym = symbols[document.getElementById('currency').value] || '$';
            document.getElementById('currencySymbol').textContent  = sym;
            document.getElementById('currencySymbol2').textContent = sym;

            renderChart(prospects, leads, customers, months);
        }

        ['totalRevenue', 'avgOrderValue', 'campaignStart', 'campaignEnd',
         'currency', 'language', 'leadRate', 'prospectRate'].forEach(id => {
            document.getElementById(id).addEventListener('input',  update);
            document.getElementById(id).addEventListener('change', update);
        });

        update();
    </script>

</body>
</html>
