<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a2332;
            color: #e0e6f0;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1e2a3a;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #2d3f55;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-icon {
            background: #3a5070;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 14px;
            color: #e0e6f0;
        }

        .logo strong {
            color: #e0e6f0;
        }

        .container {
            display: flex;
            flex: 1;
        }

        .sidebar {
            width: 280px;
            background: #1e2a3a;
            padding: 24px 20px;
            border-right: 1px solid #2d3f55;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #8b9bb4;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .form-group select,
        .form-group input[type="date"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 9px 12px;
            background: #243044;
            border: 1px solid #2d3f55;
            color: #e0e6f0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: #4a90e2;
        }

        .input-prefix {
            display: flex;
            align-items: center;
            background: #243044;
            border: 1px solid #2d3f55;
            border-radius: 6px;
            overflow: hidden;
        }

        .input-prefix span {
            padding: 9px 10px;
            background: #1e2a3a;
            color: #8b9bb4;
            border-right: 1px solid #2d3f55;
            font-size: 14px;
            flex-shrink: 0;
        }

        .input-prefix input {
            border: none !important;
            border-radius: 0 !important;
            flex: 1;
            background: transparent;
        }

        .main {
            flex: 1;
            padding: 24px;
            display: flex;
            gap: 24px;
        }

        .chart-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-wrapper {
            background: #1e2a3a;
            border-radius: 10px;
            padding: 20px;
            flex: 1;
            min-height: 300px;
        }

        .sliders-section {
            background: #1e2a3a;
            border-radius: 10px;
            padding: 20px;
            color: #8b9bb4;
        }

        .sliders-section p {
            margin-bottom: 12px;
        }

        .cards-section {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: #243044;
            border-radius: 10px;
            padding: 16px 18px;
            color: #8b9bb4;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <span class="logo-icon">&#9660;</span>
            <span><strong>Lead</strong>Predictor</span>
        </div>
    </header>

    <div class="container">

        <aside class="sidebar">
            <div class="form-group">
                <label>Language</label>
                <select id="language">
                    <option value="en">&#127482;&#127480; English</option>
                    <option value="bg">&#127463;&#127468; Bulgarian</option>
                    <option value="de">&#127465;&#127466; German</option>
                    <option value="fr">&#127467;&#127479; French</option>
                </select>
            </div>

            <div class="form-group">
                <label>Currency</label>
                <select id="currency">
                    <option value="USD">$ US Dollar</option>
                    <option value="EUR">&#8364; Euro</option>
                    <option value="BGN">&#1083;&#1074; Bulgarian Lev</option>
                    <option value="GBP">&#163; British Pound</option>
                </select>
            </div>

            <div class="form-group">
                <label>Campaign Start</label>
                <input type="date" id="campaignStart" value="2026-05-08">
            </div>

            <div class="form-group">
                <label>Campaign End</label>
                <input type="date" id="campaignEnd" value="2026-11-04">
            </div>

            <div class="form-group">
                <label>Total Revenue</label>
                <div class="input-prefix">
                    <span id="currencySymbol">$</span>
                    <input type="number" id="totalRevenue" value="10000" min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Avg. Order Value</label>
                <div class="input-prefix">
                    <span id="currencySymbol2">$</span>
                    <input type="number" id="avgOrderValue" value="1000" min="1">
                </div>
            </div>
        </aside>

        <main class="main">

            <div class="chart-section">
                <div class="chart-wrapper">
                    <div id="chart">Chart placeholder</div>
                </div>
                <div class="sliders-section">
                    <p>Lead Response Rate</p>
                    <p>Prospect Response Rate</p>
                </div>
            </div>

            <div class="cards-section">
                <div class="card">Prospects</div>
                <div class="card">Leads</div>
                <div class="card">Customers</div>
            </div>

        </main>

    </div>

    <script>
        document.getElementById('currency').addEventListener('change', function () {
            const symbols = { USD: '$', EUR: '€', BGN: 'лв', GBP: '£' };
            const sym = symbols[this.value] || '$';
            document.getElementById('currencySymbol').textContent = sym;
            document.getElementById('currencySymbol2').textContent = sym;
        });
    </script>

</body>
</html>
